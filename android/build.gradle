// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

// Pin Facebook SDK to an exact version so Gradle does not resolve the floating
// "18.+" range on every build (avoids slow/flaky dependency resolution).
// 18.0.3 is the latest stable and what Meta's Events Manager expects (clears
// the "please upgrade the SDK" warning).
ext {
  facebookSdkVersion = "18.0.3"
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
